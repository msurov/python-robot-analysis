[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-analysis"
version = "0.1.0"
description = "The python project demonstrates a typical structure"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "scipy>=1.18.1",
  "numpy==2.5.3",
  "casadi_bspline @ git+https://github.com/msurov/casadi_bspline.git",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]        # discover top-level packages robot_dynamics, 
                       # robot_visualization, common, scenarios

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
